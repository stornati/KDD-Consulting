  <style>
  /* Keeping CSS unchanged for brevity */
  :root{
      --bg:#0f172a;
      --panel:#0b1220;
      --card:#0b1428;
      --primary:#0ea5e9;
      --primary-2:#22d3ee;
      --ok:#22c55e;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --border:#1f2937;
      --ink:#0b1220;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),#0b1020 60%,#0a0f1f);color:var(--text)}
    a{color:inherit;text-decoration:none}
    .container{width:100%;max-width:1140px;margin:0 auto;padding:0 20px}
    header{position:sticky;top:0;z-index:40;background:rgba(2,6,23,.7);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
    .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.3px}
    .logo-badge{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:grid;place-items:center;color:white;font-weight:800}
    nav a{margin-left:18px;opacity:.9}
    .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:#0a1328;padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer}
    .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));border-color:transparent;color:#051b0f}
    .btn-outline{background:transparent}
    .hero{padding:72px 0 32px}
    .hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:36px;align-items:center}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:12px}
    h1{font-size:clamp(28px,4vw,48px);line-height:1.05;margin:16px 0 12px}
    .sub{font-size:clamp(16px,2.2vw,20px);color:#cbd5e1}
    .hero-card{border:1px solid var(--border);background:radial-gradient(1200px 400px at 50% -20%,rgba(34,211,238,.12),transparent),#070d1c;padding:22px;border-radius:16px}
    .hero-form{display:grid;gap:12px}
    .hero-form input, .hero-form select, .hero-form textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:#0a1224;color:#e2e8f0}
    .hero-form textarea{min-height:80px}
    .section{padding:70px 0;border-top:1px solid var(--border)}
    .section h2{font-size:clamp(22px,3vw,36px);margin:0 0 10px}
    .lead{color:#cbd5e1;max-width:860px}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px}
    .card{border:1px solid var(--border);background:linear-gradient(180deg,#0b1220,#0b1428);border-radius:16px;padding:18px}
    .card h3{margin:2px 0 10px}
    .feat{display:flex;gap:10px;align-items:flex-start;margin:8px 0;color:#cbd5e1}
    .feat i{width:18px;height:18px;border-radius:999px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:inline-block;margin-top:3px}
    .pricing{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:32px}
    .price-card{border:1px solid var(--border);background:radial-gradient(800px 200px at 50% -10%,rgba(14,165,233,.12),transparent),#0a1328;border-radius:18px;padding:22px;position:relative}
    .ribbon{position:absolute;top:14px;right:14px;background:#f59e0b;color:#111827;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
    .price{font-size:36px;font-weight:800;margin:8px 0}
    .period{font-size:13px;color:var(--muted)}
    .ul{margin:12px 0 16px;padding:0;list-style:none}
    .ul li{display:flex;gap:10px;margin:8px 0;color:#cbd5e1}
    .ul li::before{content:"✓";display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;border-radius:999px;background:#0f1b36}
    .testimonials{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}
    .quote{border:1px solid var(--border);background:#0a1328;border-radius:16px;padding:16px}
    .quote p{margin:0 0 10px;color:#dbe2f0}
    .quote .who{color:#a8b1c4;font-size:14px}
    footer{border-top:1px solid var(--border);padding:26px 0;color:#94a3b8}
    .float-wa{position:fixed;right:16px;bottom:16px;z-index:50}
    .float-wa a{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#06240f;border-radius:999px;padding:12px 16px;font-weight:800;text-decoration:none;box-shadow:0 10px 30px rgba(14,165,233,.35)}
  </style>
</head>
